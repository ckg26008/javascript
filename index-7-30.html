<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
    <script>
        function action(){
            document.querySelector("p").
            textContent="hello"
            document.querySelector("button").textContent="change string"
            document.querySelector("p").
            style.color="red"
            document.querySelector("#yy").
            style.display="none".
        }
    </script>
</head>
<body>
    <p>この文字を置き換えます</p>
    <p>私の名前は桑原です</p>
    <button onclick="action()">文字を書き換える</button>
</body>
</html>
